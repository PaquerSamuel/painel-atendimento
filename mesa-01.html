<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Painel - Mesa</title>
    
    <!-- Firebase App (Core) e Cloud Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-primary: #090d16;
            --bg-secondary: #131d31;
            --bg-card: #1a2642;
            --border-color: #273759;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-geral: #0ea5e9;
            --color-prioritario: #ef4444;
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-error: #f43f5e;
            --theme-btn-bg: #131d31;
            --theme-btn-border: #273759;
            --theme-btn-text: #f8fafc;
            --flag-border: #273759;
        }

        [data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-card: #e2e8f0;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --color-geral: #0284c7;
            --color-prioritario: #dc2626;
            --color-success: #16a34a;
            --color-warning: #d97706;
            --color-error: #e11d48;
            --theme-btn-bg: #f8fafc;
            --theme-btn-border: #cbd5e1;
            --theme-btn-text: #0f172a;
            --flag-border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
        }

        .container-geral {
            width: 100%;
            max-width: 1450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .header {
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 2px;
            letter-spacing: 1px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-btn {
            background-color: var(--theme-btn-bg);
            border: 1px solid var(--theme-btn-border);
            color: var(--theme-btn-text);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            outline: none;
        }

        .top-btn:hover {
            filter: brightness(1.1);
        }

        .badge-mesa {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            font-size: 0.95rem;
            padding: 4px 18px;
            border-radius: 50px;
            font-weight: 700;
            display: inline-block;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #38bdf8;
        }

        .language-flags {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-right: 4px;
        }

        .flag-btn {
            background-color: var(--theme-btn-bg);
            border: 2px solid var(--flag-border);
            border-radius: 6px;
            padding: 3px 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .flag-btn img {
            width: 22px;
            height: 15px;
            object-fit: cover;
            border-radius: 2px;
            display: block;
        }

        .flag-btn:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }

        .flag-btn.active {
            border-color: #0284c7 !important;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.6);
            transform: scale(1.05);
            opacity: 1;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 14px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 1100px) {
            html, body { overflow: auto; }
            .main-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 10px; }
            .header-left, .header-controls { width: 100%; justify-content: center; }
        }

        .coluna-escola, .coluna-direita {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .tabelas-lado-a-lado {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 768px) {
            .tabelas-lado-a-lado { grid-template-columns: 1fr; }
        }

        .display-chamada {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .display-chamada .titulo-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .display-chamada .senha-atual {
            font-size: 4rem;
            font-weight: 900;
            color: var(--color-success);
            letter-spacing: 2px;
            line-height: 1;
        }

        .timer-atendimento {
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .timer-atendimento span {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--color-warning);
        }

        .painel-controlo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex-shrink: 0;
        }

        .card-acao {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-acao {
            border: none;
            border-radius: 10px;
            padding: 10px 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .btn-acao:active:not(:disabled) { transform: scale(0.97); }
        .btn-acao:hover:not(:disabled) { filter: brightness(1.1); }
        .btn-acao:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(40%);
        }

        .btn-chamar-auto {
            background: linear-gradient(135deg, #d97706, #b45309);
            grid-column: span 2;
            min-height: 48px;
            border: 1px solid #f59e0b;
        }

        .grupo-conclusao {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            grid-column: span 2;
        }

        .btn-concluir {
            background: linear-gradient(135deg, #16a34a, #15803d);
            min-height: 44px;
            border: 1px solid #22c55e;
            font-size: 0.85rem !important;
        }

        .btn-cancelar-atendimento {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            min-height: 44px;
            border: 1px solid #f87171;
            font-size: 0.85rem !important;
        }

        .btn-chamar-a {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: 1px solid #38bdf8;
            min-height: 42px;
        }

        .btn-chamar-p {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            border: 1px solid #f87171;
            min-height: 42px;
        }

        .btn-repetir {
            background: linear-gradient(135deg, #475569, #334155);
            grid-column: span 2;
            min-height: 38px;
            border: 1px solid #64748b;
        }

        .badge-espera {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge-espera span {
            color: var(--color-success);
            font-size: 0.95rem;
            font-weight: 800;
        }

        .painel-lista {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .painel-lista h3 {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .lista-scroll {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            padding-right: 4px;
        }

        .lista-scroll::-webkit-scrollbar { width: 5px; }
        .lista-scroll::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }

        .lista-scroll li {
            padding: 8px 10px;
            background-color: var(--bg-card);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #64748b;
            flex-shrink: 0;
        }

        .lista-scroll li.geral { border-left-color: var(--color-geral); }
        .lista-scroll li.prioritario { border-left-color: var(--color-prioritario); }

        .badge-concluida {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--color-success);
            border: 1px solid var(--color-success);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            margin-left: 6px;
        }

        .badge-cancelada {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--color-error);
            border: 1px solid var(--color-error);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            margin-left: 6px;
        }

        .btn-chamar-especifico {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .btn-chamar-especifico:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container-geral">
        <div class="header">
            <div class="header-left">
                <div id="badgeMesa" class="badge-mesa">MESA --</div>
            </div>
            <div class="header-content">
                <h1 id="txtTituloPainel">Painel de Atendimento</h1>
            </div>
            <div class="header-controls">
                <div class="language-flags">
                    <button class="flag-btn" id="flag-pt" onclick="mudarIdioma('pt')" title="Português">
                        <img src="https://flagcdn.com/w80/pt.png" alt="PT">
                    </button>
                    <button class="flag-btn" id="flag-en" onclick="mudarIdioma('en')" title="English">
                        <img src="https://flagcdn.com/w80/gb.png" alt="EN">
                    </button>
                </div>
                <button class="top-btn" id="btnMudoGlobal" onclick="alternarMudoGlobal()" title="Silenciar som">
                    <span id="iconeMudo">🔊</span> <span id="textoMudo">Som Ativo</span>
                </button>
                <button class="top-btn" onclick="forcarFullscreenTV()" title="Forçar TV em Ecrã Cheio">
                    📺 ⛶ <span id="txtBtnTv">Forçar TV</span>
                </button>
                <button class="top-btn" id="btnThemeToggle" onclick="alternarTema()">
                    <span id="themeIcon">🌙</span> <span id="themeText">Tema</span>
                </button>
                <button class="top-btn" id="btnFullscreen" onclick="alternarFullscreen()" title="Ecrã Cheio">
                    <span id="fullscreenIcon">⛶</span>
                </button>
            </div>
        </div>

        <div class="main-grid">
            <div class="coluna-escola">
                <div class="display-chamada">
                    <div id="txtTituloDisplay" class="titulo-display">Senha em Atendimento</div>
                    <div id="displaySenha" class="senha-atual">---</div>
                    <div id="timerContainer" class="timer-atendimento" style="display: none;">
                        <span id="txtRotuloTempo">Tempo:</span> <span id="displayTimer">00:00</span>
                    </div>
                </div>

                <div class="painel-controlo">
                    <div class="card-acao" style="grid-column: span 2;">
                        <button id="btnChamarProxima" class="btn-acao btn-chamar-auto" onclick="chamarProximaSequencia()">
                            <span id="txtBtnChamarProxima" style="font-size: 1rem;">Chamar Próxima da Fila</span>
                            <small id="txtSubChamarProxima" style="font-size: 0.7rem; opacity: 0.85; font-weight: normal;">(Sequência Automática Inteligente)</small>
                        </button>
                    </div>

                    <div class="card-acao grupo-conclusao">
                        <button id="btnConcluir" class="btn-acao btn-concluir" onclick="concluirAtendimento()" disabled>
                            <span id="txtBtnConcluir">✓ Concluir</span>
                        </button>
                        <button id="btnCancelar" class="btn-acao btn-cancelar-atendimento" onclick="cancelarAtendimento()" disabled>
                            <span id="txtBtnCancelar">✕ Ausente / Cancelar</span>
                        </button>
                    </div>

                    <div class="card-acao">
                        <button id="btnGeral" class="btn-acao btn-chamar-a" onclick="chamarEspecificoTipo('A')">
                            <span id="txtBtnGeral">Geral</span>
                            <small style="font-size: 0.7rem; opacity: 0.85; font-weight: normal;">[A]</small>
                        </button>
                        <div class="badge-espera"><span id="txtEspera1">Espera</span>: <span id="qtdGeral">0</span></div>
                    </div>

                    <div class="card-acao">
                        <button id="btnPrioritario" class="btn-acao btn-chamar-p" onclick="chamarEspecificoTipo('P')">
                            <span id="txtBtnPrioritario">Prioritário</span>
                            <small style="font-size: 0.7rem; opacity: 0.85; font-weight: normal;">[P]</small>
                        </button>
                        <div class="badge-espera"><span id="txtEspera2">Espera</span>: <span id="qtdPrioritario">0</span></div>
                    </div>

                    <div class="card-acao" style="grid-column: span 2;">
                        <button class="btn-acao btn-repetir" onclick="repetirSinal()">
                            <span id="txtBtnRepetir">🔄 Repetir Chamada Atual (Som e Voz)</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="coluna-direita">
                <div class="tabelas-lado-a-lado">
                    <div class="painel-lista">
                        <h3 id="txtTituloEspera">Em Espera (<span id="qtdTotal" style="color: var(--color-success);">0</span>)</h3>
                        <ul id="listaPendentes" class="lista-scroll">
                            <li id="txtCarregandoFila">A carregar fila...</li>
                        </ul>
                    </div>

                    <div class="painel-lista">
                        <h3 id="txtTituloHistorico">Últimas Chamadas</h3>
                        <ul id="listaHistorico" class="lista-scroll">
                            <li id="txtNenhumaChamada">Nenhuma chamada.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Firebase com as tuas credenciais reais
        const firebaseConfig = {
            apiKey: "AIzaSyCoyDbE3uycXcua4nor94xsPJhZ5IBFTzY",
            authDomain: "painel-atendimento-62b5f.firebaseapp.com",
            projectId: "painel-atendimento-62b5f",
            storageBucket: "painel-atendimento-62b5f.appspot.com",
            messagingSenderId: "14880228149",
            appId: "1:14880228149:web:30dac7c8ed042e128027c"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const docRefEstado = db.collection("sistema_senhas").doc("estado_global");

        const CHAVE_TEMA_MESA = 'sistema_senhas_tema_mesa';
        const CHAVE_LOGS_ERRO = 'sistema_senhas_logs_erro';
        const CHAVE_MUDO_GLOBAL = 'sistema_senhas_mudo_global';
        const CHAVE_IDIOMA_MESA = 'sistema_senhas_idioma_mesa';

        let estadoGlobalCache = null;

        const traducoes = {
            pt: {
                tituloPainel: "Painel de Atendimento",
                somAtivo: "Som Ativo",
                sistemaMudo: "Sistema Mudo",
                forcarTv: "Forçar TV",
                tema: "Tema",
                escuro: "Escuro",
                claro: "Claro",
                tituloDisplay: "Senha em Atendimento",
                rotuloTempo: "Tempo de Atendimento:",
                chamarProxima: "Chamar Próxima da Fila",
                subChamarProxima: "(Sequência Automática Inteligente)",
                concluir: "✓ Concluir",
                cancelarAtendimento: "✕ Ausente / Cancelar",
                geral: "Geral",
                prioritario: "Prioritário",
                espera: "Espera",
                repetir: "🔄 Repetir Chamada Atual (Som e Voz)",
                tituloEspera: "Em Espera",
                carregandoFila: "A carregar fila...",
                tituloHistorico: "Últimas Chamadas",
                nenhumaChamada: "Nenhuma chamada.",
                tagConcluida: "Concluída",
                tagCancelada: "Não Compareceu",
                alertaSemSenhas: "Não há senhas pendentes!",
                alertaSemTipo: "Não há senhas para este tipo.",
                alertaNenhumaParaRepetir: "Nenhuma senha para repetir.",
                alertaConcluirPrimeiro: "Conclua ou cancele o atendimento atual antes de chamar outra senha!",
                falaGeral: "Senha atendimento geral, número",
                falaPrioritaria: "Senha prioritária, número",
                dirigirSe: "dirigir-se a"
            },
            en: {
                tituloPainel: "Service Panel",
                somAtivo: "Sound On",
                sistemaMuted: "Muted",
                forcarTv: "Force TV",
                tema: "Theme",
                escuro: "Dark",
                claro: "Light",
                tituloDisplay: "Serving Ticket",
                rotuloTempo: "Service Time:",
                chamarProxima: "Call Next in Queue",
                subChamarProxima: "(Smart Automatic Sequence)",
                concluir: "✓ Finish",
                cancelarAtendimento: "✕ No Show / Cancel",
                geral: "General",
                priority: "Priority",
                espera: "Waiting",
                repetir: "🔄 Repeat Current Call (Sound & Voice)",
                tituloEspera: "Waiting Queue",
                carregandoFila: "Loading queue...",
                tituloHistorico: "Recent Calls",
                nenhumaChamada: "No calls yet.",
                tagConcluida: "Completed",
                tagCancelada: "No Show",
                alertaSemSenhas: "No pending tickets!",
                alertaSemTipo: "No tickets for this option.",
                alertaNenhumaParaRepetir: "No ticket to repeat.",
                alertaConcluirPrimeiro: "Please finish or cancel the current service before calling another ticket!",
                falaGeral: "General service ticket number",
                falaPrioritaria: "Priority ticket number",
                dirigirSe: "please proceed to"
            }
        };

        function detetarNomeMesa() {
            const path = window.location.pathname;
            const match = path.match(/mesa[-_]?0?([1-9])/i);
            return match ? `MESA 0${match[1]}` : 'MESA 01';
        }

        const NOME_MESA = detetarNomeMesa();
        document.getElementById('badgeMesa').innerText = NOME_MESA;
        document.getElementById('tituloPagina').innerText = `Painel - ${NOME_MESA}`;

        let ultimaSenhaChamada = "---";
        let listaVozes = [];
        let timerAtendimentoInterval = null;

        function obterIdiomaAtual() {
            const lang = localStorage.getItem(CHAVE_IDIOMA_MESA);
            return (lang === 'en' || lang === 'pt') ? lang : 'pt';
        }

        function mudarIdioma(lang) {
            localStorage.setItem(CHAVE_IDIOMA_MESA, lang);
            aplicarIdioma(lang);
        }

        function aplicarIdioma(lang) {
            const t = traducoes[lang] || traducoes['pt'];
            const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
            
            setTxt('txtTituloPainel', t.tituloPainel);
            setTxt('txtBtnTv', t.forcarTv);
            setTxt('txtTituloDisplay', t.tituloDisplay);
            setTxt('txtRotuloTempo', t.rotuloTempo);
            setTxt('txtBtnChamarProxima', t.chamarProxima);
            setTxt('txtSubChamarProxima', t.subChamarProxima);
            setTxt('txtBtnConcluir', t.concluir);
            setTxt('txtBtnCancelar', t.cancelarAtendimento);
            setTxt('txtBtnGeral', t.geral);
            setTxt('txtBtnPrioritario', t.prioritario);
            setTxt('txtEspera1', t.espera);
            setTxt('txtEspera2', t.espera);
            setTxt('txtBtnRepetir', t.repetir);
            setTxt('txtCarregandoFila', t.carregandoFila);
            setTxt('txtTituloHistorico', t.tituloHistorico);
            setTxt('txtNenhumaChamada', t.nenhumaChamada);

            const qtdTotalEl = document.getElementById('qtdTotal');
            const qtdTotalNum = qtdTotalEl ? qtdTotalEl.innerText : '0';
            const tituloEsperaEl = document.getElementById('txtTituloEspera');
            if (tituloEsperaEl) {
                tituloEsperaEl.innerHTML = `${t.tituloEspera} (<span id="qtdTotal" style="color: var(--color-success);">${qtdTotalNum}</span>)`;
            }

            atualizarBotaoMudoUI();
            
            document.querySelectorAll('.flag-btn').forEach(btn => btn.classList.remove('active'));
            const btnAtivo = document.getElementById(`flag-${lang}`);
            if (btnAtivo) btnAtivo.classList.add('active');

            if (estadoGlobalCache) atualizarInterface(estadoGlobalCache);
        }

        function registarErroSistema(origem, mensagemErro) {
            try {
                const timestamp = new Date().toLocaleTimeString('pt-PT');
                const logItem = `[${timestamp}] [${NOME_MESA}] ${origem}: ${mensagemErro}`;
                let errosAtuais = JSON.parse(localStorage.getItem(CHAVE_LOGS_ERRO) || '[]');
                errosAtuais.push(logItem);
                localStorage.setItem(CHAVE_LOGS_ERRO, JSON.stringify(errosAtuais));
            } catch (e) {
                console.error("Falha crítica ao gravar log:", e);
            }
        }

        function alternarFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => registarErroSistema('Fullscreen', err.message));
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function forcarFullscreenTV() {
            docRefEstado.update({ comandoFullscreenTV: Date.now() }).catch(err => registarErroSistema('ForcarFullscreenTV', err.message));
        }

        function estaSistemaMudo() {
            return localStorage.getItem(CHAVE_MUDO_GLOBAL) === 'true';
        }

        function atualizarBotaoMudoUI() {
            const mudo = estaSistemaMudo();
            const lang = obterIdiomaAtual();
            const t = traducoes[lang];
            const icone = document.getElementById('iconeMudo');
            const texto = document.getElementById('textoMudo');
            if (icone && texto) {
                if (mudo) {
                    icone.innerText = '🔇';
                    texto.innerText = t.sistemaMudo;
                } else {
                    icone.innerText = '🔊';
                    texto.innerText = t.somAtivo;
                }
            }
        }

        function alternarMudoGlobal() {
            const estadoAtual = estaSistemaMudo();
            const novoEstado = !estadoAtual;
            localStorage.setItem(CHAVE_MUDO_GLOBAL, novoEstado ? 'true' : 'false');
            atualizarBotaoMudoUI();
            
            if (novoEstado && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const iconeFS = document.getElementById('fullscreenIcon');
            if (iconeFS) iconeFS.innerText = document.fullscreenElement ? '🗗' : '⛶';
        });

        function inicializarTema() {
            aplicarTema(localStorage.getItem(CHAVE_TEMA_MESA) || 'dark');
        }

        function alternarTema() {
            const novoTema = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            aplicarTema(novoTema);
            localStorage.setItem(CHAVE_TEMA_MESA, novoTema);
        }

        function aplicarTema(tema) {
            const lang = obterIdiomaAtual();
            const t = traducoes[lang];
            const icone = document.getElementById('themeIcon');
            const texto = document.getElementById('themeText');
            if (tema === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                if (icone) icone.innerText = '☀️'; 
                if (texto) texto.innerText = t.claro;
            } else {
                document.documentElement.removeAttribute('data-theme');
                if (icone) icone.innerText = '🌙'; 
                if (texto) texto.innerText = t.escuro;
            }
        }

        function carregarVozes() { 
            if ('speechSynthesis' in window) listaVozes = window.speechSynthesis.getVoices(); 
        }
        if ('speechSynthesis' in window) { 
            carregarVozes(); 
            window.speechSynthesis.onvoiceschanged = carregarVozes; 
        }

        function tocarAudioChamada() {
            if (estaSistemaMudo()) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const tocarNota = (freq, tempoInicio, duracao) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + tempoInicio);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + tempoInicio);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + tempoInicio + duracao);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + tempoInicio); osc.stop(audioCtx.currentTime + tempoInicio + duracao);
                };
                tocarNota(660, 0, 0.3); tocarNota(880, 0.3, 0.5);
            } catch (e) { registarErroSistema('AudioContext', e.message); }
        }

        function falarSenha(codigo) {
            if (estaSistemaMudo()) return;
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const partes = codigo.split('-');
                    const lang = obterIdiomaAtual();
                    const t = traducoes[lang];
                    
                    let prefixoFala = partes[0].trim() === 'P' ? t.falaPrioritaria : t.falaGeral;
                    let textoFala = `${prefixoFala} ${parseInt(partes[1], 10)}, ${t.dirigirSe} ${NOME_MESA}`;
                    
                    const mensagem = new SpeechSynthesisUtterance(textoFala);
                    let langCode = lang === 'en' ? 'en-GB' : 'pt-PT';
                    let vozMatch = listaVozes.find(v => v.lang === langCode || v.lang.startsWith(lang));
                    if (vozMatch) mensagem.voice = vozMatch;
                    mensagem.lang = langCode; mensagem.rate = 0.85;
                    window.speechSynthesis.speak(mensagem);
                } catch (e) { registarErroSistema('SpeechSynthesis', e.message); }
            }
        }

        function obterPendentes(estado, filtro = 'TODAS') {
            if (!estado || !estado.historico) return [];
            if (!estado.chamadas) estado.chamadas = [];
            return estado.historico.filter(registo => {
                const match = registo.match(/Senha:\s*([A-Z]-\d{3})/);
                if (!match) return false;
                const codigo = match[1];
                if (estado.chamadas.some(ch => ch.codigo === codigo)) return false;
                if (filtro === 'TODAS') return true;
                return codigo.startsWith(filtro + '-');
            });
        }

        function verificarEstadoBotoesAtendimento(estado) {
            if (!estado) return;
            if (!estado.atendimentoAtualPorMesa) estado.atendimentoAtualPorMesa = {};

            const senhaEmAtendimento = estado.atendimentoAtualPorMesa[NOME_MESA];
            const emAtendimento = !!senhaEmAtendimento;

            const btnChamarProxima = document.getElementById('btnChamarProxima');
            const btnGeral = document.getElementById('btnGeral');
            const btnPrioritario = document.getElementById('btnPrioritario');
            const btnConcluir = document.getElementById('btnConcluir');
            const btnCancelar = document.getElementById('btnCancelar');
            const botoesEspecificosLista = document.querySelectorAll('.btn-chamar-especifico');

            if (btnChamarProxima) btnChamarProxima.disabled = emAtendimento;
            if (btnGeral) btnGeral.disabled = emAtendimento;
            if (btnPrioritario) btnPrioritario.disabled = emAtendimento;
            if (btnConcluir) btnConcluir.disabled = !emAtendimento;
            if (btnCancelar) btnCancelar.disabled = !emAtendimento;

            botoesEspecificosLista.forEach(btn => {
                btn.disabled = emAtendimento;
            });
        }

        function gerirTimerAtendimento(timestampInicioAtendimento) {
            const timerContainer = document.getElementById('timerContainer');
            const displayTimer = document.getElementById('displayTimer');

            if (timerAtendimentoInterval) {
                clearInterval(timerAtendimentoInterval);
                timerAtendimentoInterval = null;
            }

            if (!timestampInicioAtendimento) {
                if (timerContainer) timerContainer.style.display = 'none';
                return;
            }

            if (timerContainer) timerContainer.style.display = 'flex';

            const atualizarContador = () => {
                const agora = Date.now();
                const diffSegundos = Math.floor((agora - timestampInicioAtendimento) / 1000);
                const minutos = Math.floor(diffSegundos / 60).toString().padStart(2, '0');
                const segundos = (diffSegundos % 60).toString().padStart(2, '0');
                if (displayTimer) {
                    displayTimer.innerText = `${minutos}:${segundos}`;
                }
            };

            atualizarContador();
            timerAtendimentoInterval = setInterval(atualizarContador, 1000);
        }

        function atualizarInterface(estado) {
            if (!estado) return;
            const pendentesA = obterPendentes(estado, 'A');
            const pendentesP = obterPendentes(estado, 'P');
            const todasPendentes = [...pendentesP, ...pendentesA];
            
            const qGeral = document.getElementById('qtdGeral');
            const qPrio = document.getElementById('qtdPrioritario');
            const qTotal = document.getElementById('qtdTotal');
            
            if (qGeral) qGeral.innerText = pendentesA.length;
            if (qPrio) qPrio.innerText = pendentesP.length;
            if (qTotal) qTotal.innerText = todasPendentes.length;
            
            const lang = obterIdiomaAtual();
            const t = traducoes[lang];

            const ulPendentes = document.getElementById('listaPendentes');
            if (ulPendentes) {
                ulPendentes.innerHTML = '';
                if (todasPendentes.length === 0) {
                    ulPendentes.innerHTML = `<li style="color: var(--text-muted); justify-content: center; background: transparent; border: none;">${t.nenhumaChamada}</li>`;
                } else {
                    todasPendentes.forEach(registo => {
                        const match = registo.match(/\[(.*?)\]\s*Senha:\s*([A-Z]-\d{3})\s*\|\s*Tipo:\s*(.*)/);
                        if (match) {
                            const hora = match[1].split(' ')[1] || match[1];
                            const codigo = match[2];
                            const classeTipo = codigo.startsWith('P-') ? 'prioritario' : 'geral';
                            const textoBtnChamada = lang === 'en' ? 'Call' : 'Chamar';
                            const li = document.createElement('li');
                            li.className = classeTipo;
                            li.innerHTML = `
                                <strong>${codigo}</strong>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 0.75rem; color: var(--text-muted);">${hora}</span>
                                    <button class="btn-chamar-especifico" onclick="chamarRegistoEspecifico('${registo.replace(/'/g, "\\'")}')">${textoBtnChamada}</button>
                                </div>`;
                            ulPendentes.appendChild(li);
                        }
                    });
                }
            }

            const ulHistorico = document.getElementById('listaHistorico');
            if (ulHistorico) {
                ulHistorico.innerHTML = '';
                if (!estado.chamadas || estado.chamadas.length === 0) {
                    ulHistorico.innerHTML = `<li style="color: var(--text-muted); justify-content: center; background: transparent; border: none;">${t.nenhumaChamada}</li>`;
                } else {
                    [...estado.chamadas].reverse().forEach(ch => {
                        let tagHtml = '';
                        if (ch.concluida) {
                            tagHtml = `<span class="badge-concluida">${t.tagConcluida}</span>`;
                        } else if (ch.cancelada) {
                            tagHtml = `<span class="badge-cancelada">${t.tagCancelada}</span>`;
                        }

                        const li = document.createElement('li');
                        li.innerHTML = `<span><strong>${ch.codigo}</strong> <span style="color: var(--color-geral); font-size:0.75rem;">(${ch.mesa})</span> ${tagHtml}</span> <span style="font-size: 0.75rem; color: var(--text-muted);">${ch.hora}</span>`;
                        li.className = ch.codigo.startsWith('P-') ? 'prioritario' : 'geral';
                        ulHistorico.appendChild(li);
                    });
                }
            }

            verificarEstadoBotoesAtendimento(estado);
        }

        function atualizarVisor(codigo, timestampInicio = null) {
            ultimaSenhaChamada = codigo;
            const el = document.getElementById('displaySenha');
            if (el) {
                el.innerText = codigo;
                el.style.color = codigo.startsWith('P-') ? 'var(--color-prioritario)' : (codigo.startsWith('A-') ? 'var(--color-geral)' : 'var(--color-success)');
            }
            gerirTimerAtendimento(timestampInicio);
        }

        function processarChamada(registo) {
            const lang = obterIdiomaAtual();
            const t = traducoes[lang];

            docRefEstado.get().then((doc) => {
                if (!doc.exists) return;
                let estado = doc.data();

                if (!estado.atendimentoAtualPorMesa) estado.atendimentoAtualPorMesa = {};
                if (estado.atendimentoAtualPorMesa[NOME_MESA]) {
                    alert(t.alertaConcluirPrimeiro);
                    return;
                }

                const codigoSenha = registo.match(/Senha:\s*([A-Z]-\d{3})/)[1];
                const horaChamada = new Date().toLocaleTimeString('pt-PT');
                const timestampInicio = Date.now();
                
                estado.atendimentoAtualPorMesa[NOME_MESA] = codigoSenha;
                if (!estado.timingsAtendimento) estado.timingsAtendimento = {};
                estado.timingsAtendimento[NOME_MESA] = timestampInicio;

                if (!estado.chamadas) estado.chamadas = [];
                
                estado.chamadas.push({ 
                    codigo: codigoSenha, 
                    hora: horaChamada, 
                    mesa: NOME_MESA, 
                    concluida: false, 
                    cancelada: false,
                    inicioTimestamp: timestampInicio
                });
                
                docRefEstado.set(estado).then(() => {
                    atualizarVisor(codigoSenha, timestampInicio);
                    tocarAudioChamada();
                    falarSenha(codigoSenha);
                });
            }).catch(err => registarErroSistema('ProcessarChamada', err.message));
        }

        function concluirAtendimento() {
            docRefEstado.get().then((doc) => {
                if (!doc.exists) return;
                let estado = doc.data();
                if (!estado.atendimentoAtualPorMesa) estado.atendimentoAtualPorMesa = {};

                const senhaAtual = estado.atendimentoAtualPorMesa[NOME_MESA];
                const fimTimestamp = Date.now();

                if (senhaAtual && estado.chamadas) {
                    const chamadaRegisto = estado.chamadas.slice().reverse().find(ch => ch.mesa === NOME_MESA && ch.codigo === senhaAtual && !ch.concluida && !ch.cancelada);
                    if (chamadaRegisto) {
                        chamadaRegisto.concluida = true;
                        chamadaRegisto.fimTimestamp = fimTimestamp;
                        chamadaRegisto.duracaoSegundos = Math.floor((fimTimestamp - (chamadaRegisto.inicioTimestamp || fimTimestamp)) / 1000);
                    }
                }

                delete estado.atendimentoAtualPorMesa[NOME_MESA];
                if (estado.timingsAtendimento) delete estado.timingsAtendimento[NOME_MESA];

                docRefEstado.set(estado).then(() => {
                    gerirTimerAtendimento(null);
                });
            }).catch(err => registarErroSistema('ConcluirAtendimento', err.message));
        }

        function cancelarAtendimento() {
            docRefEstado.get().then((doc) => {
                if (!doc.exists) return;
                let estado = doc.data();
                if (!estado.atendimentoAtualPorMesa) estado.atendimentoAtualPorMesa = {};

                const senhaAtual = estado.atendimentoAtualPorMesa[NOME_MESA];
                const fimTimestamp = Date.now();

                if (senhaAtual && estado.chamadas) {
                    const chamadaRegisto = estado.chamadas.slice().reverse().find(ch => ch.mesa === NOME_MESA && ch.codigo === senhaAtual && !ch.concluida && !ch.cancelada);
                    if (chamadaRegisto) {
                        chamadaRegisto.cancelada = true;
                        chamadaRegisto.fimTimestamp = fimTimestamp;
                        chamadaRegisto.duracaoSegundos = Math.floor((fimTimestamp - (chamadaRegisto.inicioTimestamp || fimTimestamp)) / 1000);
                    }
                }

                delete estado.atendimentoAtualPorMesa[NOME_MESA];
                if (estado.timingsAtendimento) delete estado.timingsAtendimento[NOME_MESA];

                docRefEstado.set(estado).then(() => {
                    gerirTimerAtendimento(null);
                });
            }).catch(err => registarErroSistema('CancelarAtendimento', err.message));
        }

        function chamarProximaSequencia() {
            docRefEstado.get().then((doc) => {
                if (!doc.exists) return;
                let estado = doc.data();
                const lang = obterIdiomaAtual();
                const t = traducoes[lang];

                if (estado.atendimentoAtualPorMesa && estado.atendimentoAtualPorMesa[NOME_MESA]) {
                    alert(t.alertaConcluirPrimeiro);
                    return;
                }

                const pendentesP = obterPendentes(estado, 'P');
                const pendentesA = obterPendentes(estado, 'A');
                if (pendentesP.length === 0 && pendentesA.length === 0) { alert(t.alertaSemSenhas); return; }
                if (!estado.prioritariasConsecutivas) estado.prioritariasConsecutivas = 0;
                let proximoRegisto = null;
                if (pendentesP.length > 0 && estado.prioritariasConsecutivas < 2) {
                    proximoRegisto = pendentesP[0]; estado.prioritariasConsecutivas += 1;
                } else if (pendentesA.length > 0) {
                    proximoRegisto = pendentesA[0]; estado.prioritariasConsecutivas = 0;
                } else if (pendentesP.length > 0) {
                    proximoRegisto = pendentesP[0]; estado.prioritariasConsecutivas += 1;
                }
                if (proximoRegisto) processarChamada(proximoRegisto);
            });
        }

        function chamarEspecificoTipo(pref) {
            docRefEstado.get().then((doc) => {
                if (!doc.exists) return;
                let estado = doc.data();
                const lang = obterIdiomaAtual();
                const t = traducoes[lang];

                if (estado.atendimentoAtualPorMesa && estado.atendimentoAtualPorMesa[NOME_MESA]) {
                    alert(t.alertaConcluirPrimeiro);
                    return;
                }

                const pendentes = obterPendentes(estado, pref);
                if (pendentes.length === 0) { alert(t.alertaSemTipo); return; }
                if (pref === 'P') { estado.prioritariasConsecutivas = (estado.prioritariasConsecutivas || 0) + 1; } else { estado.prioritariasConsecutivas = 0; }
                processarChamada(pendentes[0]);
            });
        }

        function chamarRegistoEspecifico(registoTexto) {
            docRefEstado.get().then((doc) => {
                if (!doc.exists) return;
                let estado = doc.data();
                const lang = obterIdiomaAtual();
                const t = traducoes[lang];

                if (estado.atendimentoAtualPorMesa && estado.atendimentoAtualPorMesa[NOME_MESA]) {
                    alert(t.alertaConcluirPrimeiro);
                    return;
                }

                const codigoSenha = registoTexto.match(/Senha:\s*([A-Z]-\d{3})/)[1];
                if (codigoSenha.startsWith('P-')) { estado.prioritariasConsecutivas = (estado.prioritariasConsecutivas || 0) + 1; } else { estado.prioritariasConsecutivas = 0; }
                processarChamada(registoTexto);
            });
        }

        function repetirSinal() {
            const lang = obterIdiomaAtual();
            const t = traducoes[lang];
            if (ultimaSenhaChamada !== "---") { tocarAudioChamada(); falarSenha(ultimaSenhaChamada); } else { alert(t.alertaNenhumaParaRepetir); }
        }

        docRefEstado.onSnapshot((doc) => {
            if (doc.exists) {
                const estado = doc.data();
                estadoGlobalCache = estado;
                atualizarInterface(estado);

                if (estado.atendimentoAtualPorMesa && estado.atendimentoAtualPorMesa[NOME_MESA]) {
                    const senhaAtual = estado.atendimentoAtualPorMesa[NOME_MESA];
                    const timestampInicio = estado.timingsAtendimento ? estado.timingsAtendimento[NOME_MESA] : null;
                    if (senhaAtual !== ultimaSenhaChamada) {
                        atualizarVisor(senhaAtual, timestampInicio);
                    }
                } else {
                    atualizarVisor("---", null);
                }
            }
        }, (error) => {
            registarErroSistema('FirestoreSnapshot', error.message);
        });

        window.onload = function() {
            inicializarTema();
            const idiomaSalvo = obterIdiomaAtual();
            aplicarIdioma(idiomaSalvo);
        };
    </script>
</body>
</html>
